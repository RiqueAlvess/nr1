{% load static %}
<!-- Header Desktop -->
<header class="sticky top-0 z-40 w-full border-b bg-white shadow-sm">
    <div class="flex h-16 items-center justify-between px-6">

        <!-- Título da Página -->
        <div>
            <h1 class="text-xl font-semibold text-gray-900">
                {% block page_title_text %}Dashboard{% endblock %}
            </h1>
        </div>

        <!-- User Dropdown -->
        <div class="relative" x-data="{ open: false }">
            <!-- Botão do Dropdown -->
            <button
                @click="open = !open"
                @keydown.escape.window="open = false"
                class="flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-gray-100 transition-colors"
                :aria-expanded="open">

                <!-- Avatar -->
                <div class="w-9 h-9 bg-gray-900 rounded-lg flex items-center justify-center">
                    <span class="font-semibold text-white text-sm">{{ user.username|first|upper }}</span>
                </div>

                <!-- Nome (desktop) -->
                <div class="hidden md:block text-left">
                    <p class="text-sm font-medium text-gray-900">{{ user.username }}</p>
                    {% if user.perfil_acesso %}
                    <p class="text-xs text-gray-500">{{ user.perfil_acesso.get_grupo_principal }}</p>
                    {% endif %}
                </div>

                <!-- Seta -->
                <svg class="w-4 h-4 text-gray-400 transition-transform duration-200"
                     :class="{ 'rotate-180': open }"
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>

            <!-- Menu Dropdown -->
            <div x-show="open"
                 x-cloak
                 @click.outside="open = false"
                 x-transition:enter="transition ease-out duration-100"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 class="absolute right-0 mt-2 w-56 bg-white rounded-lg border border-gray-200 shadow-lg z-50"
                 role="menu">

                <div class="p-2">
                    <!-- Info do Usuário -->
                    <div class="px-3 py-2 border-b border-gray-100 mb-2">
                        <p class="text-sm font-medium text-gray-900">{{ user.username }}</p>
                        {% if user.perfil_acesso %}
                        <p class="text-xs text-gray-500">{{ user.perfil_acesso.get_grupo_principal }}</p>
                        {% endif %}
                    </div>

                    <!-- Links -->
                    {% if user.is_superuser %}
                    <a href="/admin/"
                       @click="open = false"
                       class="flex items-center gap-2 rounded-md px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        Administração
                    </a>
                    {% endif %}

                    <a href="{% url 'account:logout' %}"
                       class="flex items-center gap-2 rounded-md px-3 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        Sair
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>
