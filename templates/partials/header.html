{% load static %}
<!-- Header Desktop - Estilo Shadcn -->
<header class="sticky top-0 z-40 w-full border-b border-border bg-white/95 backdrop-blur supports-[backdrop-filter]:bg-white/60">
    <div class="flex h-16 items-center px-6">
        <!-- Breadcrumb ou título da página -->
        <div class="flex-1">
            {% block page_title %}
            <h1 class="text-xl font-semibold text-foreground">
                {% block page_title_text %}Dashboard{% endblock %}
            </h1>
            {% endblock %}
        </div>

        <!-- User Menu -->
        <div class="flex items-center gap-4">
            <!-- Notificações (futuro) -->
            <button class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors hover:bg-muted h-9 w-9">
                <i data-lucide="bell" class="w-5 h-5 text-muted-foreground"></i>
            </button>

            <!-- User Dropdown -->
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open"
                        class="flex items-center gap-2 rounded-lg px-3 py-2 hover:bg-muted transition-colors">
                    <div class="w-8 h-8 bg-accent rounded-lg flex items-center justify-center">
                        <span class="font-semibold text-primary text-sm">{{ user.username|first|upper }}</span>
                    </div>
                    <div class="hidden md:block text-left">
                        <p class="text-sm font-medium text-foreground">{{ user.username }}</p>
                        {% if user.perfil_acesso %}
                        <p class="text-xs text-muted-foreground">{{ user.perfil_acesso.get_grupo_principal }}</p>
                        {% endif %}
                    </div>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground"></i>
                </button>

                <!-- Dropdown Menu -->
                <div x-show="open"
                     @click.away="open = false"
                     x-transition:enter="transition ease-out duration-100"
                     x-transition:enter-start="transform opacity-0 scale-95"
                     x-transition:enter-end="transform opacity-100 scale-100"
                     x-transition:leave="transition ease-in duration-75"
                     x-transition:leave-start="transform opacity-100 scale-100"
                     x-transition:leave-end="transform opacity-0 scale-95"
                     class="absolute right-0 mt-2 w-56 origin-top-right rounded-md bg-card border border-border shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none"
                     style="display: none;">
                    <div class="p-2">
                        <div class="px-3 py-2 border-b border-border mb-2">
                            <p class="text-sm font-medium text-foreground">{{ user.username }}</p>
                            {% if user.perfil_acesso %}
                            <p class="text-xs text-muted-foreground">{{ user.perfil_acesso.get_grupo_principal }}</p>
                            {% endif %}
                        </div>

                        {% if user.is_superuser %}
                        <a href="/admin/"
                           class="flex items-center gap-2 rounded-md px-3 py-2 text-sm hover:bg-muted transition-colors">
                            <i data-lucide="settings" class="w-4 h-4"></i>
                            <span>Administração</span>
                        </a>
                        {% endif %}

                        <a href="{% url 'account:logout' %}"
                           class="flex items-center gap-2 rounded-md px-3 py-2 text-sm text-destructive hover:bg-destructive/10 transition-colors">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                            <span>Sair</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
