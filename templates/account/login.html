{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vivamente360</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }

        :root {
            --primary: #0F3D52;
            --primary-light: #1a5a75;
            --accent: #1EEB88;
            --background: #f8fafc;
            --foreground: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        .login-card {
            background: white;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-light);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .input-field {
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 61, 82, 0.1);
            outline: none;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4" x-data="{ showPassword: false, loading: false }" x-cloak>

    <div class="w-full max-w-md">
        <!-- Card Principal -->
        <div class="login-card rounded-2xl p-8 md:p-10">

            <!-- Logo e Título -->
            <div class="text-center mb-8">
                <!-- Logo SEM background -->
                <div class="flex justify-center mb-4">
                    <img src="{% static 'public/icone.png' %}" alt="Vivamente360" class="w-16 h-16">
                </div>
                <h1 class="text-2xl font-bold text-gray-900 mb-2">Vivamente360</h1>
                <p class="text-gray-500 text-sm">Acesse sua conta</p>
            </div>

            <!-- Django Messages -->
            {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                <div class="p-3 rounded-lg text-sm
                    {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
                    {% elif message.tags == 'success' %}bg-green-50 text-green-700 border border-green-200
                    {% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Formulário -->
            <form method="post" class="space-y-5" @submit="loading = true">
                {% csrf_token %}

                <!-- Campo Usuário -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        E-mail ou Usuário
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Digite seu e-mail ou usuário"
                        class="input-field w-full h-11 px-4 rounded-lg text-gray-900 placeholder-gray-400"
                        required
                        autocomplete="username"
                        autofocus
                    />
                </div>

                <!-- Campo Senha -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Senha
                    </label>
                    <div class="relative">
                        <input
                            :type="showPassword ? 'text' : 'password'"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            class="input-field w-full h-11 px-4 pr-12 rounded-lg text-gray-900 placeholder-gray-400"
                            required
                            autocomplete="current-password"
                        />
                        <button
                            type="button"
                            @click="showPassword = !showPassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors"
                            tabindex="-1">
                            <!-- Ícone Olho -->
                            <svg x-show="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <!-- Ícone Olho Fechado -->
                            <svg x-show="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-cloak>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Link Esqueci Senha -->
                <div class="text-right">
                    <a href="{% url 'account:password_reset_request' %}"
                       class="text-sm text-gray-500 hover:text-gray-700 transition-colors">
                        Esqueceu a senha?
                    </a>
                </div>

                <!-- Botão de Login -->
                <button
                    type="submit"
                    class="btn-primary w-full h-12 rounded-lg font-semibold text-base flex items-center justify-center gap-2"
                    :disabled="loading">

                    <!-- Estado Normal -->
                    <span x-show="!loading">Entrar</span>

                    <!-- Estado Loading -->
                    <template x-if="loading">
                        <span class="flex items-center gap-2">
                            <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
                            </svg>
                            Entrando...
                        </span>
                    </template>
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-8 pt-6 border-t border-gray-100">
                <p class="text-center text-xs text-gray-400">
                    Conformidade: <span class="font-medium text-gray-500">NR-1 • LGPD • HSE-IT</span>
                </p>
            </div>
        </div>

        <!-- Info adicional -->
        <div class="mt-6 text-center">
            <p class="text-xs text-gray-400">
                Problemas para acessar? Contate o <span class="font-medium text-gray-500">Suporte TI</span>
            </p>
        </div>
    </div>

</body>
</html>
