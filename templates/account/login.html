<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vivamente360</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'public/icone.png' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'public/icone.ico' %}">
    <link rel="apple-touch-icon" href="{% static 'public/icone.png' %}">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- DaisyUI + Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />

    <!-- CSS Local -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <!-- Alpine.JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Login page specific styles - Lovable inspired */
        .login-container {
            background: linear-gradient(135deg, #fafafa 0%, #ffffff 100%);
        }

        .login-card {
            background: white;
            border: 2px solid black;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: black;
            opacity: 0.6;
            pointer-events: none;
        }

        .input-with-icon {
            padding-left: 2.5rem;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: black;
            opacity: 0.6;
            padding: 0.25rem;
            transition: opacity 0.2s ease;
        }

        .password-toggle:hover {
            opacity: 1;
        }

        .btn-primary-custom {
            background: hsl(0, 0%, 9%);
            color: white;
            transition: all 0.2s ease;
        }

        .btn-primary-custom:hover {
            background: hsl(0, 0%, 20%);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .btn-primary-custom:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="login-container min-h-screen flex items-center justify-center p-4" x-data="{ showPassword: false }">

    <div class="w-full max-w-md">
        <!-- Card Principal -->
        <div class="login-card rounded-2xl p-8 md:p-10">

            <!-- Logo e Título -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-black rounded-2xl mb-4">
                    <img src="{% static 'public/icone.png' %}" alt="Vivamente360" class="w-10 h-10">
                </div>
                <h1 class="text-2xl font-bold text-black mb-2">Vivamente360</h1>
                <p class="text-black opacity-60 text-sm">Bem-vindo de volta</p>
            </div>

            <!-- Formulário -->
            <form method="post" class="space-y-5">
                {% csrf_token %}

                <!-- Campo E-mail/Usuário -->
                <div class="form-control">
                    <label for="username" class="label">
                        <span class="label-text font-medium text-sm text-black">E-mail ou Usuário</span>
                    </label>
                    <div class="input-group">
                        <i data-lucide="user" class="input-icon w-5 h-5"></i>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Digite seu e-mail ou usuário"
                            class="input input-bordered w-full input-with-icon bg-white text-black"
                            required
                            autofocus
                        />
                    </div>
                </div>

                <!-- Campo Senha -->
                <div class="form-control">
                    <label for="password" class="label">
                        <span class="label-text font-medium text-sm text-black">Senha</span>
                    </label>
                    <div class="input-group">
                        <i data-lucide="lock" class="input-icon w-5 h-5"></i>
                        <input
                            type="password"
                            x-bind:type="showPassword ? 'text' : 'password'"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            class="input input-bordered w-full input-with-icon pr-12 bg-white text-black"
                            required
                        />
                        <button
                            type="button"
                            @click="showPassword = !showPassword"
                            class="password-toggle"
                            aria-label="Mostrar/ocultar senha">
                            <i :data-lucide="showPassword ? 'eye-off' : 'eye'" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Link Esqueci a Senha -->
                <div class="text-right">
                    <a href="{% url 'account:password_reset_request' %}"
                       class="text-sm text-black opacity-60 hover:opacity-100 transition-opacity">
                        Esqueceu a senha?
                    </a>
                </div>

                <!-- Botão de Login -->
                <button type="submit" class="btn btn-primary-custom w-full h-12 text-base font-medium">
                    Acessar
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-8 pt-6 border-t border-black">
                <p class="text-center text-xs text-black opacity-60">
                    Conformidade: <span class="font-medium">NR-1 • LGPD • HSE-IT</span>
                </p>
            </div>
        </div>

        <!-- Info adicional -->
        <div class="mt-6 text-center">
            <p class="text-xs text-black opacity-60">
                Problemas para acessar? Contate o <span class="font-medium">Suporte TI</span>
            </p>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });

        // Re-initialize icons when Alpine updates DOM
        document.addEventListener('alpine:initialized', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>

</body>
</html>
