<!DOCTYPE html>
<html lang="pt-BR">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vivamente360</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'public/icone.png' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'public/icone.ico' %}">
    <link rel="apple-touch-icon" href="{% static 'public/icone.png' %}">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Local -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <style>
        /* Login page specific styles */
        .login-container {
            background: linear-gradient(135deg, hsl(var(--background)) 0%, hsl(var(--secondary)) 100%);
        }

        .login-card {
            background: white;
            border-radius: calc(var(--radius) * 1.5);
            border: 1px solid hsl(var(--border));
            box-shadow: var(--shadow-xl);
            padding: var(--space-8);
        }

        @media (min-width: 768px) {
            .login-card {
                padding: var(--space-10);
            }
        }

        .password-toggle {
            position: absolute;
            right: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: hsl(var(--muted-foreground));
            padding: var(--space-2);
            transition: color var(--transition-base);
        }

        .password-toggle:hover {
            color: hsl(var(--foreground));
        }

        .input-password-wrapper {
            position: relative;
            width: 100%;
        }

        .input-password {
            padding-right: var(--space-12);
        }
    </style>
</head>
<body class="login-container min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="login-card">

            <!-- Logo e Título -->
            <div class="text-center mb-8">
                <img src="{% static 'public/icone.png' %}" alt="Vivamente360" class="w-16 h-16 mx-auto mb-4">
                <h1 class="text-xl font-bold text-foreground">Vivamente360</h1>
                <p class="text-muted-foreground text-sm mt-2">Fazer login</p>
            </div>

            <!-- Formulário -->
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <!-- Campo E-mail/Usuário -->
                <div>
                    <label for="username" class="block text-sm font-medium text-foreground mb-2">
                        E-mail ou Usuário
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Digite seu e-mail ou usuário"
                        class="input w-full"
                        required
                        autofocus
                    />
                </div>

                <!-- Campo Senha -->
                <div>
                    <label for="password" class="block text-sm font-medium text-foreground mb-2">
                        Senha
                    </label>
                    <div class="input-password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            class="input input-password w-full"
                            required
                        />
                        <button
                            type="button"
                            onclick="togglePassword()"
                            class="password-toggle"
                            aria-label="Mostrar/ocultar senha">
                            <svg id="eye-icon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="eye-off-icon" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Botão de Login -->
                <div class="pt-2">
                    <button type="submit" class="btn btn-accent w-full shadow-sm">
                        Acessar
                    </button>
                </div>
            </form>

            <!-- Links adicionais -->
            <div class="mt-8 flex justify-between items-center text-sm">
                <a href="{% url 'account:password_reset_request' %}" class="text-primary hover:underline font-medium">
                    Esqueceu a senha?
                </a>
                <span class="text-muted-foreground/30">|</span>
                <span class="text-muted-foreground">Suporte TI</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center">
            <p class="text-xs text-foreground/40 font-medium uppercase tracking-widest">
                Conformidade: NR-1 • LGPD • HSE-IT
            </p>
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeOffIcon = document.getElementById('eye-off-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        }
    </script>

</body>
</html>
