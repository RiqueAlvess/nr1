<!-- Toast Container - Adicionar no base.html antes do </body> -->
<div id="toast-container"
     class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"
     x-data="toastSystem()"
     @show-toast.window="addToast($event.detail)">

    <template x-for="toast in toasts" :key="toast.id">
        <div x-show="toast.visible"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-x-full"
             x-transition:enter-end="opacity-100 translate-x-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-x-0"
             x-transition:leave-end="opacity-0 translate-x-full"
             class="flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg min-w-[300px] max-w-md"
             :class="{
                 'bg-green-50 border border-green-200 text-green-800': toast.type === 'success',
                 'bg-red-50 border border-red-200 text-red-800': toast.type === 'error',
                 'bg-blue-50 border border-blue-200 text-blue-800': toast.type === 'info',
                 'bg-yellow-50 border border-yellow-200 text-yellow-800': toast.type === 'warning'
             }">

            <!-- Ícone -->
            <div class="flex-shrink-0">
                <template x-if="toast.type === 'success'">
                    <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                </template>
                <template x-if="toast.type === 'error'">
                    <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </template>
                <template x-if="toast.type === 'info'">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </template>
                <template x-if="toast.type === 'warning'">
                    <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </template>
            </div>

            <!-- Mensagem -->
            <p class="text-sm font-medium flex-1" x-text="toast.message"></p>

            <!-- Fechar -->
            <button @click="removeToast(toast.id)" class="flex-shrink-0 hover:opacity-70 transition-opacity">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </template>
</div>

<script>
function toastSystem() {
    return {
        toasts: [],
        addToast(detail) {
            const id = Date.now();
            const toast = {
                id,
                type: detail.type || 'info',
                message: detail.message,
                visible: true
            };
            this.toasts.push(toast);

            // Auto-remove após 5 segundos
            setTimeout(() => {
                this.removeToast(id);
            }, detail.duration || 5000);
        },
        removeToast(id) {
            const index = this.toasts.findIndex(t => t.id === id);
            if (index > -1) {
                this.toasts[index].visible = false;
                setTimeout(() => {
                    this.toasts = this.toasts.filter(t => t.id !== id);
                }, 300);
            }
        }
    };
}

// Função helper global
window.showToast = function(type, message, duration = 5000) {
    window.dispatchEvent(new CustomEvent('show-toast', {
        detail: { type, message, duration }
    }));
};
</script>
