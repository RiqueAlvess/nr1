{% comment %}
  Dropdown Component Example - Vivamente360
  Exemplo de uso do componente dropdown

  Usage:
  <button onclick="toggleDropdown('my-dropdown')" class="btn btn-primary">
    Abrir Menu
  </button>
  <div id="my-dropdown" class="dropdown">
    <div class="dropdown-content">
      <a href="#" class="dropdown-item">Item 1</a>
      <a href="#" class="dropdown-item">Item 2</a>
      <div class="dropdown-divider"></div>
      <a href="#" class="dropdown-item">Item 3</a>
    </div>
  </div>
{% endcomment %}

<!-- Exemplo 1: Dropdown com botão -->
<div class="relative inline-block">
  <button onclick="toggleDropdown('dropdown-example-1')" class="btn btn-outline flex items-center gap-2">
    <i data-lucide="more-vertical" class="w-4 h-4"></i>
    Menu
    <i data-lucide="chevron-down" class="w-4 h-4"></i>
  </button>
  <div id="dropdown-example-1" class="dropdown">
    <div class="dropdown-content">
      <a href="#" class="dropdown-item">
        <i data-lucide="edit" class="w-4 h-4"></i>
        Editar
      </a>
      <a href="#" class="dropdown-item">
        <i data-lucide="copy" class="w-4 h-4"></i>
        Duplicar
      </a>
      <div class="dropdown-divider"></div>
      <a href="#" class="dropdown-item text-destructive">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
        Excluir
      </a>
    </div>
  </div>
</div>

<!-- Exemplo 2: Dropdown de Usuário -->
<div class="relative inline-block ml-4">
  <button onclick="toggleDropdown('dropdown-user')" class="flex items-center gap-2 p-2 rounded-lg hover:bg-muted transition-colors">
    <div class="w-8 h-8 bg-accent rounded-full flex items-center justify-center">
      <span class="font-semibold text-primary text-sm">U</span>
    </div>
    <i data-lucide="chevron-down" class="w-4 h-4 text-muted-foreground"></i>
  </button>
  <div id="dropdown-user" class="dropdown">
    <div class="dropdown-content">
      <div class="px-3 py-2 border-b border-border">
        <p class="text-sm font-medium">Usuario</p>
        <p class="text-xs text-muted-foreground">usuario@exemplo.com</p>
      </div>
      <a href="#" class="dropdown-item">
        <i data-lucide="user" class="w-4 h-4"></i>
        Perfil
      </a>
      <a href="#" class="dropdown-item">
        <i data-lucide="settings" class="w-4 h-4"></i>
        Configurações
      </a>
      <div class="dropdown-divider"></div>
      <a href="#" class="dropdown-item">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        Sair
      </a>
    </div>
  </div>
</div>

<!-- Exemplo 3: Dropdown com ícones Lucide (após carregamento) -->
<script>
  // Re-initialize Lucide icons após DOM updates
  if (typeof lucide !== 'undefined') {
    lucide.createIcons();
  }
</script>
